  1 # Place a copy of this config to ~/.aerospace.toml
  2 # After that, you can edit ~/.aerospace.toml to your liking
  3 # Config version for compatibility and deprecations
  4 # Fallback value (if you omit the key): config-version = 1
  5 config-version = 2
  6 
  7 # You can use it to add commands that run after AeroSpace startup.
  8 # Available commands : https://nikitabobko.github.io/AeroSpace/commands
  9 after-startup-command = []
 10 
 11 # Start AeroSpace at login
 12 start-at-login = true
 13 
 14 # Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
 15 enable-normalization-flatten-containers = true
 16 enable-normalization-opposite-orientation-for-nested-containers = true
 17 
 18 # See: https://nikitabobko.github.io/AeroSpace/guide#layouts
 19 # The 'accordion-padding' specifies the size of accordion padding
 20 # You can set 0 to disable the padding feature
 21 accordion-padding = 30
 22 
 23 # Possible values: tiles|accordion
 24 default-root-container-layout = 'tiles'
 25 
 26 # Possible values: horizontal|vertical|auto
 27 # 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
 28 #               tall monitor (anything higher than wide) gets vertical orientation
 29 default-root-container-orientation = 'auto'
 30 
 31 # Mouse follows focus when focused monitor changes
 32 # Drop it from your config, if you don't like this behavior
 33 # See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
 34 # See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
 35 # Fallback value (if you omit the key): on-focused-monitor-changed = []
 36 on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
 37 
 38 # You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
 39 # Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
 40 # Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
 41 automatically-unhide-macos-hidden-apps = false
 42 
 43 # List of workspaces that should stay alive even when they contain no windows,
 44 # even when they are invisible.
 45 # This config version is only available since 'config-version = 2'
 46 # Fallback value (if you omit the key): persistent-workspaces = []
 47 persistent-workspaces = ["1", "2", "3", "C"]
 48 
 49 # A callback that runs every time binding mode changes
 50 # See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
 51 # See: https://nikitabobko.github.io/AeroSpace/commands#mode
 52 on-mode-changed = []
 53 
 54 # Possible values: (qwerty|dvorak|colemak)
 55 # See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
 56 [key-mapping]
 57     preset = 'qwerty'
 58 
 59 # Gaps between windows (inner-*) and between monitor edges (outer-*).
 60 # Possible values:
 61 # - Constant:     gaps.outer.top = 8
 62 # - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
 63 #                 In this example, 24 is a default value when there is no match.
 64 #                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
 65 #                 See:
 66 #                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
 67 [gaps]
 68     inner.horizontal = 10
 69     inner.vertical =   10
 70     outer.left =       10
 71     outer.bottom =     10
 72     outer.top =        10
 73     outer.right =      10
 74 
 75 # 'main' binding mode declaration
 76 # See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
 77 # 'main' binding mode must be always presented
 78 # Fallback value (if you omit the key): mode.main.binding = {}
 79 [mode.main.binding]
 80 
 81     # All possible keys:
 82     # - Letters.        a, b, c, ..., z
 83     # - Numbers.        0, 1, 2, ..., 9
 84     # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
 85     # - F-keys.         f1, f2, ..., f20
 86     # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
 87     #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
 88     #                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
 89     #                   sectionSign (ISO keyboards only, european keyboards only)
 90     # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
 91     #                   keypadMinus, keypadMultiply, keypadPlus
 92     # - Arrows.         left, down, up, right
 93 
 94     # All possible modifiers: cmd, alt, ctrl, shift
 95 
